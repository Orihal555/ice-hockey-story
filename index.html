<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07121f">
<title>ICE HOCKEY STORY</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07121f;color:#f5f8fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:680px;margin:auto;padding:18px 14px 100px}
.card{background:#0d1d2d;border:1px solid #294861;border-radius:18px;padding:16px;margin:12px 0}
.title{font-size:34px;font-weight:900;margin:42px 0 8px}
.sub{color:#91a8ba}
h2,h3{margin:0 0 10px}
label{display:block;color:#9db1c0;font-size:12px;margin:12px 0 5px}
input,select{width:100%;height:48px;border:1px solid #365a74;border-radius:11px;background:#081522;color:white;padding:8px 10px;font-size:16px}
button{width:100%;min-height:48px;border:1px solid #3c6c88;border-radius:12px;background:#153149;color:#fff;font-weight:800;font-size:15px;padding:10px;margin-top:8px}
.primary{background:#087da8;border-color:#69dcff}
.green{background:#15583d;border-color:#61df99}
.red{background:#612f39;border-color:#ff7373}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#081522;border:1px solid #1e394f;border-radius:12px;padding:10px}
.stat small{display:block;color:#91a8ba}.stat b{font-size:21px}
.feed{border-top:1px solid #20394e;padding-top:8px;margin-top:8px;font-size:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:#07121ff5;border-top:1px solid #294861;padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:flex;gap:5px}
nav button{margin:0;background:transparent;border:0;color:#8fa7b9;font-size:10px;min-height:45px}
nav button.active{background:#12304a;color:white}
.choice{text-align:left}
.choice b{display:block}.choice small{display:block;color:#9db1c0;font-weight:500;margin-top:3px}
.score{text-align:center;font-size:29px;font-weight:900;margin:14px 0}
.hidden{display:none}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

var saveKey = "ICE_HOCKEY_STORY_V6";
var game = null;
var page = "home";

var teams = {
  "Canada CHL":["London Knights","Oshawa Generals","Seattle Thunderbirds","Medicine Hat Tigers"],
  "US NCAA":["Boston University","University of Michigan","Minnesota Golden Gophers","Denver Pioneers"],
  "Sweden":["Frölunda HC J20","Djurgårdens IF J20","Skellefteå AIK J20"],
  "Finland":["Tappara U20","HIFK U20","Jokerit U20"],
  "Japan":["Tohoku Free Blades","Red Eagles Hokkaido","Yokohama Grits","Nikko IceBucks"]
};

var nhl = [
 ["Edmonton Oilers","Bakersfield Condors","Fort Wayne Komets"],
 ["Seattle Kraken","Coachella Valley Firebirds","Kansas City Mavericks"],
 ["Vancouver Canucks","Abbotsford Canucks","Kalamazoo Wings"],
 ["Minnesota Wild","Iowa Wild","Jacksonville Icemen"],
 ["Boston Bruins","Providence Bruins","Maine Mariners"],
 ["Colorado Avalanche","Colorado Eagles","New Mexico Goatheads"],
 ["Florida Panthers","Charlotte Checkers","Savannah Ghost Pirates"],
 ["Washington Capitals","Hershey Bears","South Carolina Stingrays"],
 ["Detroit Red Wings","Grand Rapids Griffins","Toledo Walleye"],
 ["Toronto Maple Leafs","Toronto Marlies","Cincinnati Cyclones"],
 ["Calgary Flames","Calgary Wranglers","Rapid City Rush"],
 ["Dallas Stars","Texas Stars","Idaho Steelheads"]
];

var europe = {
 "SHL":["Frölunda HC","Färjestad BK","Skellefteå AIK","Luleå HF"],
 "Liiga":["Tappara","Ilves","HIFK","Kärpät"],
 "DEL":["Eisbären Berlin","Adler Mannheim","Red Bull München"],
 "National League":["ZSC Lions","HC Davos","SC Bern","EV Zug"],
 "Czech Extraliga":["HC Dynamo Pardubice","HC Sparta Praha","HC Oceláři Třinec"],
 "ICEHL":["Red Bull Salzburg","KAC","Vienna Capitals"],
 "Asia League":["Tohoku Free Blades","Red Eagles Hokkaido","Yokohama Grits"]
};

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function save(){try{localStorage.setItem(saveKey,JSON.stringify(game))}catch(e){}}
function load(){try{var x=localStorage.getItem(saveKey);return x?JSON.parse(x):null}catch(e){return null}}

function titleScreen(){
 $("app").innerHTML =
 '<main>'+
 '<div class="title">🏒 ICE HOCKEY STORY</div>'+
 '<div class="sub">ONE CHOICE AT A TIME</div>'+
 '<div class="card">'+
 '<h2>新しいキャリア</h2>'+
 '<label>選手名</label><input id="name" value="HAYATO">'+
 '<label>ポジション</label><select id="pos"><option>C</option><option>LW</option><option>RW</option><option>DF</option><option>G</option></select>'+
 '<label>スタート地点</label><select id="start"><option>Canada CHL</option><option>US NCAA</option><option>Sweden</option><option>Finland</option><option>Japan</option></select>'+
 '<button class="primary" onclick="startCareer()">キャリアを始める</button>'+
 '</div>'+
 '<div class="card"><b>V6 TEST</b><p class="sub">この版はクリック処理をすべて直接ボタンに接続しています。過去版のService Workerや古いJavaScriptには依存しません。</p></div>'+
 '</main>';
}

function startCareer(){
 var name=$("name").value.trim() || "HAYATO";
 var pos=$("pos").value;
 var start=$("start").value;
 game={
  name:name,pos:pos,age:16,origin:start,league:start==="Canada CHL"?"CHL":start==="US NCAA"?"NCAA":start,
  phase:"Junior",team:pick(teams[start]),ovr:48,potential:82,form:65,energy:90,reputation:0,
  season:1,week:1,gp:0,g:0,a:0,plus:0,cups:0,history:[],feed:["キャリア開始。最初のシーズンが始まった。"],
  inbox:[],injury:0,contract:"Junior / Amateur",years:0
 };
 page="home";
 save();
 render();
}

function nav(){
 return '<nav>'+
 '<button class="'+(page==="home"?"active":"")+'" onclick="go(\'home\')">🏒<br>ホーム</button>'+
 '<button class="'+(page==="career"?"active":"")+'" onclick="go(\'career\')">👤<br>キャリア</button>'+
 '<button class="'+(page==="inbox"?"active":"")+'" onclick="go(\'inbox\')">📨<br>受信箱</button>'+
 '<button class="'+(page==="season"?"active":"")+'" onclick="go(\'season\')">📅<br>シーズン</button>'+
 '<button class="'+(page==="guide"?"active":"")+'" onclick="go(\'guide\')">🌎<br>ガイド</button>'+
 '</nav>';
}

function header(){
 return '<div class="sub">🏒 ICE HOCKEY STORY</div>';
}

function hero(){
 return '<div class="card">'+
 '<h2>'+esc(game.name)+'</h2>'+
 '<div class="sub">'+game.age+'歳 ・ '+esc(game.pos)+' ・ '+esc(game.team)+'</div>'+
 '<div class="grid" style="margin-top:12px">'+
 '<div class="stat"><small>OVR</small><b>'+game.ovr+'</b></div>'+
 '<div class="stat"><small>FORM</small><b>'+game.form+'</b></div>'+
 '<div class="stat"><small>ENERGY</small><b>'+game.energy+'</b></div>'+
 '<div class="stat"><small>REP</small><b>'+game.reputation+'</b></div>'+
 '</div></div>';
}

function home(){
 var next =
 '<div class="card"><div class="sub">WEEK '+game.week+' / 24</div><h2>今週どうする？</h2>'+
 '<button class="choice primary" onclick="match()"><b>試合に出る</b><small>成績・評価・出場機会を狙う</small></button>'+
 '<button class="choice" onclick="train()"><b>個人練習</b><small>能力を伸ばす。体力を消費。</small></button>'+
 '<button class="choice" onclick="tactic()"><b>戦術練習</b><small>フォームと評価を整える。</small></button>'+
 '<button class="choice" onclick="rest()"><b>休養</b><small>体力とフォームを回復。</small></button></div>';

 if(game.inbox.length){
  var e=game.inbox[0];
  next='<div class="card"><div class="sub">NEXT EVENT</div><h2>'+esc(e.title)+'</h2><p>'+esc(e.body)+'</p>'+
  '<button class="primary" onclick="eventChoice(0)">'+esc(e.c0)+'</button>'+
  '<button onclick="eventChoice(1)">'+esc(e.c1)+'</button></div>';
 }
 return '<main>'+header()+hero()+next+'<div class="card"><h3>CAREER FEED</h3>'+game.feed.slice(0,8).map(function(x){return '<div class="feed">'+esc(x)+'</div>'}).join("")+'</div>'+nav()+'</main>';
}

function spend(type){
 if(type==="train"){game.ovr=clamp(game.ovr+1+(Math.random()<.25?1:0),1,game.potential);game.energy=clamp(game.energy-16,0,100);game.form=clamp(game.form+2,0,100);log("個人練習。能力が上がった。")}
 if(type==="tactic"){game.form=clamp(game.form+7,0,100);game.energy=clamp(game.energy-9,0,100);game.reputation++;log("戦術練習。フォームと評価が改善。")}
 if(type==="rest"){game.energy=clamp(game.energy+30,0,100);game.form=clamp(game.form+5,0,100);log("休養。コンディションを回復。")}
 advance();
}

function train(){spend("train")}
function tactic(){spend("tactic")}
function rest(){spend("rest")}

function match(){
 if(game.injury>0){log("負傷中のため試合を欠場。");advance();return}
 game.current={step:0,home:0,away:Math.floor(Math.random()*3)};
 matchScreen();
}

function matchScreen(){
 var g=game.pos==="G";
 var texts=g?["2-on-1。パスが通りそうだ。","スロット正面からシュート。","残り30秒、1点差。"]:["敵陣でパックを保持。","スロットにスペースがある。","残り30秒、最後の攻撃。"];
 var choices=g?[["前に出る","角度を消す"],["深く構える","安定重視"],["リバウンドを外へ","守備重視"]]:[["シュート","自分で決める"],["パス","アシストを狙う"],["ボードプレー","安全に攻撃継続"]];
 $("app").innerHTML='<main>'+header()+
 '<div class="card"><div class="sub">GAME DAY ・ 勝負どころ '+(game.current.step+1)+'/3</div>'+
 '<div class="score">'+game.current.home+' - '+game.current.away+'</div>'+
 '<p>'+texts[game.current.step]+'</p>'+
 choices.map(function(c,i){return '<button class="choice" onclick="moment('+i+')"><b>'+c[0]+'</b><small>'+c[1]+'</small></button>'}).join("")+
 '</div></main>';
}

function moment(i){
 var power=game.ovr+(game.form-50)*.15+(game.energy-50)*.1+(Math.random()*24-12);
 if(game.pos==="G"){
  if((i===1&&power<55)||(i!==1&&power<47)){game.current.home++;game.form=clamp(game.form+3,0,100)}
  else game.current.away++;
 }else{
  if(i===0 && power>58 && Math.random()<.65){game.current.home++;game.g++;game.reputation+=3;log("試合でゴール！")}
  else if(i===1 && power>52 && Math.random()<.7){game.a++;game.reputation++;log("試合でアシスト！")}
  else if(i===2){game.plus++}
 }
 game.energy=clamp(game.energy-9,0,100);
 game.current.step++;
 if(game.current.step<3){matchScreen();return}
 var result=game.current.home>game.current.away?"勝利":game.current.home===game.current.away?"引き分け":"敗戦";
 game.gp++;
 game.form=clamp(game.form+(result==="勝利"?6:result==="引き分け"?1:-5),20,100);
 log("試合 "+game.current.home+"-"+game.current.away+"。"+result+"。");
 game.current=null;
 advance();
}

function advance(){
 game.week++;
 if(game.week>24){endSeason();return}
 events();
 save();
 render();
}

function events(){
 if(game.week===6 || game.week===12 || game.week===18 || game.week===22){
  var pool=[
   ["スカウトから連絡","最近のプレーを評価している。","アピールする","練習を優先"],
   ["ポジション争い","同じポジションの選手が伸びている。","競争に挑む","チームプレーを優先"]
  ];
  if(game.phase==="Pro")pool.push(["代理人から連絡","他クラブから問い合わせがある。","市場を探す","現在地に集中"]);
  var x=pick(pool);
  game.inbox.unshift({title:x[0],body:x[1],c0:x[2],c1:x[3]});
 }
}

function eventChoice(i){
 var e=game.inbox.shift();
 if(e.title==="スカウトから連絡"){if(i===0){game.reputation+=5;game.form+=4}else game.energy+=8}
 if(e.title==="ポジション争い"){if(i===0)game.ovr=clamp(game.ovr+1,1,game.potential);else game.form+=4}
 if(e.title==="代理人から連絡"){if(i===0)offers();else game.reputation++}
 log("イベント「"+e.title+"」に対応。");
 save();render();
}

function offers(){
 var org=nhl[Math.floor(Math.random()*nhl.length)];
 var arr=[];
 if(game.league==="CHL" || game.league==="NCAA"){
  arr.push({title:"NHL Entry Draft",body:org[0]+"からドラフト候補として評価されている。","c0":"キャンプを目指す","c1":"大学・ジュニアで成長"});
 }else if(game.league==="AHL"){
  arr.push({title:"NHLコールアップ候補",body:org[0]+"があなたをNHLで試す可能性がある。","c0":"勝負する","c1":"AHLで出場時間を優先"});
 }else if(game.league==="ECHL"){
  arr.push({title:"AHLコールアップ",body:org[1]+"から短期コールアップの話が来た。","c0":"受ける","c1":"現チームに残る"});
 }else{
  var l=pick(Object.keys(europe));
  arr.push({title:"欧州移籍オファー",body:l+"の"+pick(europe[l])+"が獲得に興味を示している。","c0":"移籍する","c1":"残留する"});
 }
 game.inbox.unshift(arr[0]);
}

function endSeason(){
 game.history.unshift({season:game.season,team:game.team,league:game.league,gp:game.gp,g:game.g,a:game.a});
 if(game.g+game.a>=8){game.reputation+=7;game.ovr=clamp(game.ovr+1,1,game.potential);game.feed.unshift("シーズン活躍。評価が上がった。")}
 if(game.age>=18 && game.phase==="Junior"){
  var t=pick(nhl);game.inbox.unshift({title:"NHL Entry Draft",body:t[0]+"が"+(Math.floor(Math.random()*7)+1)+"巡目で指名。キャンプへの招待が届いた。",c0:"キャンプへ","c1":"現チームで成長"});
 }
 if(game.league==="AHL" && game.gp>=10){game.playoff=true}
 game.age++;game.season++;game.week=1;game.gp=0;game.g=0;game.a=0;game.plus=0;game.energy=88;game.form=65;
 log(game.age+"歳。新シーズン開始。");
 save();render();
}

function specialChoice(i){
 var e=game.inbox.shift();
 if(e.title==="NHL Entry Draft"){
  if(i===0){var t=pick(nhl);game.phase="Pro";game.league="AHL";game.team=t[1];game.contract="NHL Entry-Level / Two-Way";game.years=3;game.reputation+=8;log("NHLキャンプ合格。AHLでプロ生活を開始。")}
  else log("まず現在の環境で成長することにした。");
 }
 if(e.title==="NHLコールアップ候補" && i===0){var t=pick(nhl);game.phase="Pro";game.league="NHL";game.team=t[0];game.reputation+=8;log("NHLコールアップ！")}
 if(e.title==="AHLコールアップ" && i===0){var t=pick(nhl);game.phase="Pro";game.league="AHL";game.team=t[1];game.reputation+=5;log("AHLへコールアップ！")}
 if(e.title==="欧州移籍オファー" && i===0){var l=pick(Object.keys(europe));game.phase="Pro";game.league=l;game.team=pick(europe[l]);game.contract="European Pro Contract";game.years=2;log("欧州へ移籍した。")}
 save();render();
}

function career(){
 return '<main>'+header()+hero()+
 '<div class="card"><h3>所属・契約</h3><p>'+esc(game.league)+' / '+esc(game.team)+'</p><p class="sub">'+esc(game.contract||"未契約")+'</p></div>'+
 '<div class="card"><h3>通算成績</h3><div class="grid"><div class="stat"><small>GP</small><b>'+game.gp+'</b></div><div class="stat"><small>G</small><b>'+game.g+'</b></div><div class="stat"><small>A</small><b>'+game.a+'</b></div><div class="stat"><small>優勝</small><b>'+game.cups+'</b></div></div></div>'+
 '<button class="red" onclick="retire()">現役を引退する</button>'+nav()+'</main>';
}

function inbox(){
 var content=game.inbox.length?game.inbox.map(function(e,i){
  return '<div class="card"><h3>'+esc(e.title)+'</h3><p>'+esc(e.body)+'</p>'+
  '<button class="primary" onclick="specialChoice('+i+')">'+esc(e.c0)+'</button>'+
  '<button onclick="specialChoice('+i+')">'+esc(e.c1)+'</button></div>';
 }).join(""):'<div class="card sub">現在、新しい通知はありません。</div>';
 return '<main>'+header()+'<h2>受信箱</h2>'+content+nav()+'</main>';
}

function season(){
 return '<main>'+header()+
 '<div class="card"><h2>Season '+game.season+'</h2><p class="sub">Week '+game.week+' / 24</p><p>'+esc(game.team)+' / '+esc(game.league)+'</p>'+
 (game.playoff?'<button class="primary" onclick="playoff()">プレーオフを進める</button>':"")+
 '</div>'+
 '<div class="card"><h3>過去シーズン</h3>'+
 (game.history.length?game.history.map(function(h){return '<div class="feed">'+h.season+'年目・'+esc(h.team)+'・'+h.gp+'GP '+h.g+'G '+h.a+'A</div>'}).join(""):'<p class="sub">まだありません。</p>')+
 '</div>'+nav()+'</main>';
}

function playoff(){
 if(!game.playoff)return;
 var chance=.45+(game.ovr-50)*.012+(game.form-50)*.003;
 if(Math.random()<clamp(chance,.25,.88)){game.cups++;game.reputation+=10;game.playoff=false;log("プレーオフ優勝！");}
 else{game.playoff=false;log("プレーオフ敗退。");}
 save();render();
}

function guide(){
 return '<main>'+header()+
 '<div class="card"><h2>ゲームの流れ</h2><p>ジュニア → ドラフト → キャンプ → AHL/ECHL → NHL → 移籍・コールアップ → プレーオフ → 引退。</p></div>'+
 '<div class="card"><h3>北米の仕組み</h3><p>AHL・ECHLはNHL組織の育成経路として扱い、サッカーのような昇格・降格ではなく、契約・コールアップ・トレードで移動する。</p></div>'+nav()+'</main>';
}

function go(p){page=p;render()}
function log(x){game.feed.unshift("W"+game.week+"・"+x);game.feed=game.feed.slice(0,60)}
function retire(){game.retired=true;save();$("app").innerHTML='<main><div class="title">CAREER COMPLETE</div><div class="card"><h2>'+esc(game.name)+'</h2><p>現役引退。'+game.age+'歳。</p><p>優勝 '+game.cups+'回</p><button class="primary" onclick="newGame()">新しいキャリア</button></div></main>'}
function newGame(){try{localStorage.removeItem(saveKey)}catch(e){}game=null;titleScreen()}

function render(){
 if(!game){titleScreen();return}
 if(game.retired){retire();return}
 if(page==="home")$("app").innerHTML=home();
 else if(page==="career")$("app").innerHTML=career();
 else if(page==="inbox")$("app").innerHTML=inbox();
 else if(page==="season")$("app").innerHTML=season();
 else guide();
}

try{
 game=load();
 if(game && typeof game!=="object")game=null;
 render();
}catch(err){
 $("app").innerHTML='<main><div class="card"><h2>起動エラー</h2><p>'+esc(err.message||err)+'</p><button onclick="newGame()">セーブをリセット</button></div></main>';
}
</script>
</body>
</html>

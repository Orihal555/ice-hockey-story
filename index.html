 S.age++;S.season++;S.week=1;S.gp=S.g=S.a=S.plus=S.pim=0;S.energy=88;S.form=65;S.morale=Math.min(100,S.morale+5);

 S.week++;

 if(S.injury)return msg("負傷中。練習はできない。"),render();

 const points=S.g+S.a;S.history.unshift({season:S.season,league:S.league,team:S.team,gp:S.gp,g:S.g,a:S.a,plus:S.plus});
 if(S.gp>0&&points/S.gp>=.7){S.awards.push("Top Performer");S.fame+=8;S.ovr=Math.min(S.pot,S.ovr+2)}
 else if(S.gp>0&&points/S.gp>=.4)S.ovr=Math.min(S.pot,S.ovr+1);
 if(S.league==="NHL"&&S.ovr>=70&&Math.random()<.25){S.trophies++;S.awards.push("Stanley Cup");msg("Stanley Cup制覇！")}
 if(S.age>=18&&!S.drafted&&S.league==="CHL")draftEvent();
 if(S.age>=20&&S.ovr>=65&&Math.random()<.35){S.nat=true;S.fame+=6;msg("代表候補に選出。")}
 newSeason();save();render();
}
function national(){if(S.ovr<58)return msg("代表選考で落選。クラブで実績を積もう。"),render();S.nat=true;S.fame+=6;S.morale=Math.min(100,S.morale+5);msg("日本代表に選出。国際大会へ。");render()}
function playoffs(){
 if(!S.playoff){S.playoff={round:1};msg("プレーオフ進出。");render();return}
 const chance=Math.min(.86,Math.max(.25,.42+(S.ovr-55)*.012+S.form*.002));
 if(Math.random()<chance){S.playoff.round++;if(S.playoff.round>=4){S.trophies++;S.awards.push(S.league==="NHL"?"Stanley Cup":"League Champion");msg("プレーオフ制覇！");S.playoff=null}else msg("プレーオフ勝利。次ラウンドへ。")}
 else{msg("プレーオフ敗退。");S.playoff=null}
 render();
}
function retire(){S.retired=true;msg("現役引退。キャリア終了。");save();render()}
function top(){return `<div class="top"><div class="brand">ICE HOCKEY STORY<small>ONE CHOICE AT A TIME</small></div><button onclick="save();msg('セーブしました。');render()">💾</button></div>`}
function nav(){return `<div class="bottom"><div class="nav">
<button class="${tab==="home"?"active":""}" onclick="tab='home';render()"><i>🏒</i>ホーム</button>
<button class="${tab==="career"?"active":""}" onclick="tab='career';render()"><i>👤</i>キャリア</button>
<button class="${tab==="inbox"?"active":""}" onclick="tab='inbox';render()"><i>📨</i>受信箱</button>
<button class="${tab==="season"?"active":""}" onclick="tab='season';render()"><i>📅</i>シーズン</button>
<button class="${tab==="guide"?"active":""}" onclick="tab='guide';render()"><i>🌎</i>ガイド</button></div></div>`}
function hero(){return `<div class="hero"><div class="phead"><div class="avatar">🏒</div><div><div class="name">${esc(S.name)}</div><div class="sub">${S.age}歳 ・ ${esc(S.pos)} ・ ${esc(S.team)}</div></div></div>
<div class="chips"><span class="chip">${esc(phase())}</span><span class="chip">S${S.season} / W${S.week} / 24</span><span class="chip">OVR ${S.ovr} / POT ${S.pot}</span>${S.drafted?`<span class="chip">Draft ${S.draftRound}R</span>`:""}${S.nat?'<span class="chip">代表</span>':""}</div>
<div style="margin-top:9px;font-size:9px;color:var(--m)">体力 ${S.energy} ・ フォーム ${S.form} ・ 士気 ${S.morale}</div><div class="bar"><i style="width:${S.energy}%"></i></div></div>`}
function next(){
 if(S.inbox.some(x=>x.type==="event"))return ["重要イベント","選択を決めるとキャリアが動く。","inbox"];
 if(S.injury)return ["回復を優先","負傷中。休養すると早く戻れる。","rest"];
 if(S.energy<35)return ["休養","コンディションが低い。","rest"];
 if(S.phase==="Junior"&&S.age>=18&&!S.drafted)return ["ドラフトを狙う","試合＋練習でスカウト評価を上げる。","train"];
 if(S.phase==="Junior"&&S.drafted)return ["NHLキャンプ","ドラフト後の最大イベント。","camp"];
 if(S.inbox.length)return ["受信箱を確認","移籍・コールアップ・契約の話が届いている。","inbox"];
 return ["次の試合","勝負どころで自分の判断をする。","match"];
}
function actionFor(t){if(t==="match")return matchStart();if(t==="rest")return rest();if(t==="camp")return camp();if(t==="inbox"){tab="inbox";return render()}train("skill")}
function home(){const n=next();return `<div class="card next"><div class="eyebrow">WHAT SHOULD I DO?</div><div class="nexttitle">${n[0]}</div><div class="nextdesc">${n[1]}</div><button class="primary" style="width:100%;margin-top:10px" onclick="actionFor('${n[2]}')">▶ ${n[0]}</button></div>
<div class="card"><h2>今週の選択</h2><div class="choices">
<button class="choice" onclick="matchStart()"><span class="num">🏒</span><span><b>試合に出る</b><small>3回の勝負どころを選択。結果が成績・評価に反映。</small></span></button>
<button class="choice" onclick="train('skill')"><span class="num">↑</span><span><b>スキル練習</b><small>OVR成長。ただし体力を消費。</small></span></button>
<button class="choice" onclick="train('tactics')"><span class="num">◎</span><span><b>戦術練習</b><small>フォームとチーム評価を整える。</small></span></button>
<button class="choice" onclick="rest()"><span class="num">＋</span><span><b>休養</b><small>体力・フォームを回復。</small></span></button></div></div>
<div class="grid2"><div class="card"><h3>今季成績</h3><div class="stat"><span>GP</span><b>${S.gp}</b></div><div class="stat"><span>G / A</span><b>${S.g} / ${S.a}</b></div></div>
<div class="card"><h3>キャリア</h3><div class="stat"><span>FAME</span><b>${S.fame}</b></div><div class="stat"><span>優勝</span><b>${S.trophies}</b></div></div></div>`}
function career(){return `<div class="card"><h2>PLAYER PROFILE</h2><div class="grid2">${[["OVR",S.ovr],["POT",S.pot],["FAME",S.fame],["MONEY","¥"+S.money.toLocaleString()],["GP",S.gp],["G",S.g],["A",S.a],["+/-",S.plus]].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join("")}</div></div>
<div class="card"><h2>所属・契約</h2><div class="list"><div class="item"><b>${esc(S.team)}</b><br><span class="muted">${esc(S.league)} ・ ${esc(S.contract)} ・ 残り${S.contractYears}年</span></div>
${S.drafted?`<div class="item"><b>NHL Draft</b><br><span class="muted">${esc(S.draftTeam)} / ${S.draftRound}巡目</span></div>`:""}<div class="item"><b>NHL契約</b><br><span class="muted">${S.nhlContract?"あり":"なし"} ・ Two-Way ${S.twoWay?"あり":"なし"} ・ Waiver ${S.waiver?"対象":"非対象"}</span></div></div></div>
<div class="card"><h2>シーズン履歴</h2><div class="list">${S.history.map(x=>`<div class="item"><b>S${x.season} ・ ${esc(x.league)}</b><br><span class="muted">${esc(x.team)} / GP ${x.gp} / ${x.g}G ${x.a}A / +/- ${x.plus}</span></div>`).join("")||'<div class="muted">まだ記録なし</div>'}</div></div>
<div class="card"><h2>受賞・トロフィー</h2><div class="list">${S.awards.map(x=>`<div class="item">🏆 ${esc(x)}</div>`).join("")||'<div class="muted">まだなし</div>'}</div></div>
<div class="card"><button class="danger" style="width:100%" onclick="retire()">現役引退</button></div>`}
function inbox(){
 return `<div class="card"><h2>📨 INBOX</h2><div class="muted">キャリアを左右する話はここに届く。受けるか、断るか。</div></div>
${S.inbox.map((o,i)=>`<div class="inbox"><div class="subject">${esc(o.title||"CAREER EVENT")}</div><div class="body">${esc(o.body)}</div>
${o.type==="event"?`<div class="actions"><button class="primary" onclick="chooseEvent(0)">${esc(o.choices[0])}</button><button onclick="chooseEvent(1)">${esc(o.choices[1])}</button></div>`:`<div class="actions"><button class="good" onclick="acceptOffer(${i})">受ける</button><button onclick="declineOffer(${i})">断る</button></div>`}</div>`).join("")||'<div class="card" style="text-align:center;color:var(--m)">受信箱は空です。</div>'}
<div class="card"><button class="primary" style="width:100%" onclick="market()">🔎 エージェントに市場を調査させる</button></div>`}
function season(){
 return `<div class="card"><h2>📅 シーズン</h2><div class="grid2"><div class="stat"><span>現在</span><b>W${S.week} / 24</b></div><div class="stat"><span>年齢</span><b>${S.age}</b></div><div class="stat"><span>フォーム</span><b>${S.form}</b></div><div class="stat"><span>体力</span><b>${S.energy}</b></div></div>
<div class="notice">毎週1アクション。試合・練習・休養を選び、節目にはイベント。シーズン終盤に成績・受賞・契約がキャリアを変える。</div></div>
<div class="card"><h2>シーズンイベント</h2><div class="list"><div class="item"><b>W8</b> スカウト / ロッカーイベント</div><div class="item"><b>W15</b> トレード期限</div><div class="item"><b>W16</b> キャリアイベント</div><div class="item"><b>W22</b> 終盤イベント</div><div class="item"><b>W24</b> シーズン終了・成績集計</div></div></div>
${S.playoff?`<div class="card"><h2>🏆 PLAYOFF</h2><div class="notice">ラウンド ${S.playoff.round}。勝てば次へ。</div><button class="warn" style="width:100%" onclick="playoffs()">プレーオフを戦う</button></div>`:""}
<div class="card"><h2>代表</h2><div class="muted">OVR・FAME・クラブ実績が高まると代表候補に選ばれやすい。</div><button style="margin-top:9px;width:100%" onclick="national()">代表選考を確認</button></div>`}
function guide(){return `<div class="card"><h2>🎮 GAME LOOP</h2><div class="list">
<div class="item"><b>① 1週間を選ぶ</b><br><span class="muted">試合・練習・休養。毎週1アクション。</span></div>
<div class="item"><b>② 試合は自分で勝負する</b><br><span class="muted">3つの勝負どころで選択。安全策かリスクか。</span></div>
<div class="item"><b>③ イベントが起きる</b><br><span class="muted">スカウト、ライバル、メディア、代理人、起用法。</span></div>
<div class="item"><b>④ 受信箱がキャリアを動かす</b><br><span class="muted">契約、コールアップ、移籍、トレード、スカウト。</span></div>
</div></div>
<div class="card"><h2>🏒 北米</h2><div class="notice"><b>NHL → AHL → ECHL</b>はサッカーの昇降格ではなく、NHL組織内のアサイン・コールアップが中心。ゲームでも機会を勝ち取る仕組みにする。</div></div>
<div class="card"><h2>🌎 リーグ</h2><div class="list">${["NHL","AHL","ECHL","SHL","Liiga","DEL","National League","Czech Extraliga","ICEHL","Asia League"].map(x=>`<div class="item"><b>${x}</b><br><span class="muted">${x==="NHL"?"Stanley Cup・最高峰":x==="AHL"?"NHL育成・Calder Cup":x==="ECHL"?"プロ育成・AHLへの道":"欧州/アジアでの移籍・競争"}</span></div>`).join("")}</div></div>
<div class="card"><button class="danger" style="width:100%" onclick="if(confirm('セーブを削除しますか？')){localStorage.removeItem('ihs3');S=null;renderStart()}">セーブ削除</button></div>`}
function renderStart(){
 $("root").innerHTML=`<div class="app"><div class="start"><div class="hero"><div class="brand">ICE HOCKEY STORY<small>FROM ROOKIE TO LEGEND</small></div><h1 style="margin:9px 0 4px;font-size:27px">君のホッケー人生を作ろう。</h1><div class="muted" style="font-size:11px;line-height:1.6">Pitch Story型の「1アクション→結果→次の選択」をアイスホッケーに置き換えたキャリアシミュレーション。</div></div>
<div class="card"><h2>PLAYER CREATE</h2><div class="field"><label>選手名</label><input id="name" placeholder="HAYATO"></div><div class="grid2"><div class="field"><label>ポジション</label><select id="pos"><option>C</option><option>LW</option><option>RW</option><option>DF</option><option>G</option></select></div><div class="field"><label>スタート</label><select id="path"><option>Canada CHL</option><option>US NCAA</option><option>Sweden</option><option>Finland</option><option>Japan</option></select></div></div><button class="primary" style="width:100%" onclick="start()">🏒 キャリア開始</button></div>
<div class="card"><h2>5つのスタート</h2><div class="route"><div><b>🇨🇦 Canada CHL</b><span>ドラフト王道</span></div><div><b>🇺🇸 US NCAA</b><span>大学→プロ</span></div><div><b>🇸🇪 Sweden</b><span>SHLルート</span></div><div><b>🇫🇮 Finland</b><span>Liigaルート</span></div><div><b>🇯🇵 Japan</b><span>Asia League→海外</span></div></div></div></div></div>`}
function render(){
 if(!S||S.retired)return renderStart();
 let content=tab==="home"?home():tab==="career"?career():tab==="inbox"?inbox():tab==="season"?season():guide();
 $("root").innerHTML=`<div class="app">${top()}${hero()}${content}</div>${nav()}`;save();
}
function load(){try{S=JSON.parse(localStorage.getItem("ihs3"))}catch(e){S=null}render()}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
load();
</script></body></html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07121f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ICE HOCKEY STORY</title>
<style>
:root{--bg:#07121f;--panel:#0d1d2d;--panel2:#11263a;--line:#294861;--text:#f5f8fb;--muted:#8fa7b9;--ice:#62d9ff;--good:#62df9a;--warn:#ffd166;--bad:#ff7373}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;padding-bottom:82px}.wrap{max-width:720px;margin:auto;padding:12px}
button,input,select{font:inherit}button{width:100%;min-height:46px;border-radius:12px;border:1px solid #365a74;background:#153149;color:#fff;padding:10px 12px;font-weight:800}
button:active{transform:scale(.985)}button.primary{background:#087da8;border-color:#69dcff}button.good{background:#15583d;border-color:#5fdf98}button.warn{background:#624b20;border-color:#ffd166}button.bad{background:#612f39;border-color:#ff7373}
button.ghost{background:transparent}.top{display:flex;justify-content:space-between;align-items:center;padding:7px 2px 13px}.logo{font-weight:950;letter-spacing:.08em}.logo small{display:block;color:var(--muted);font-size:9px;letter-spacing:.02em;margin-top:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:10px}.hero{background:linear-gradient(145deg,#10324c,#0b1827)}h1,h2,h3,p{margin-top:0}.hero h1{font-size:22px;margin-bottom:4px}.muted{color:var(--muted)}.small{font-size:11px;line-height:1.5}.tiny{font-size:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#081522;border:1px solid #1d394f;border-radius:12px;padding:10px}.stat span{display:block;color:var(--muted);font-size:9px}.stat b{font-size:19px}.bar{height:7px;background:#06101a;border-radius:99px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--ice)}
.choice{display:flex;align-items:center;gap:10px;text-align:left;margin-top:7px}.num{width:28px;height:28px;border-radius:8px;background:#19415d;display:grid;place-items:center;color:var(--ice);flex:none}.choice b{display:block;font-size:12px}.choice small{display:block;color:var(--muted);font-size:10px;margin-top:2px;font-weight:500}
.field{margin-bottom:10px}.field label{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.field input,.field select{width:100%;min-height:46px;background:#081522;color:#fff;border:1px solid #365a74;border-radius:10px;padding:9px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{display:inline-block;border:1px solid #365a74;background:#10283d;border-radius:99px;padding:4px 8px;font-size:9px;color:#cce5f2;margin:2px}.score{font-size:30px;font-weight:950;text-align:center;padding:8px}.moment{background:#10283c;border:1px solid #3a617d;border-radius:13px;padding:12px;margin:9px 0}.feed{border-top:1px solid #1d3448}.feed div{padding:9px 2px;border-bottom:1px solid #1d3448;font-size:10px;line-height:1.45}
.inbox{background:#091724;border:1px solid #294963;border-radius:13px;padding:11px;margin-bottom:8px}.inbox b{font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
.bottom{position:fixed;z-index:10;left:0;right:0;bottom:0;background:#07131ff2;border-top:1px solid #29435a;backdrop-filter:blur(15px);padding:6px 7px calc(6px + env(safe-area-inset-bottom))}.nav{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.nav button{background:transparent;border:0;color:#718b9e;min-height:54px;padding:4px;font-size:9px}.nav button.active{background:#12304a;color:#fff}.nav i{display:block;font-style:normal;font-size:18px;line-height:21px}
.start{max-width:600px;margin:30px auto}.start .title{font-size:34px;font-weight:950;letter-spacing:.02em}.error{white-space:pre-wrap;background:#35151a;border:1px solid #9a3f4b;color:#ffd8dc;padding:12px;border-radius:12px;font-size:11px}
@media(min-width:650px){.bottom{position:static;margin:10px auto 0;max-width:720px;background:transparent;border:0;backdrop-filter:none}.nav{background:#0a1724;border:1px solid var(--line);border-radius:14px;padding:5px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

const KEY="ihs5_save";
const teams={
 NHL:[
  ["Edmonton Oilers","Bakersfield Condors","Fort Wayne Komets"],["Seattle Kraken","Coachella Valley Firebirds","Kansas City Mavericks"],
  ["Vancouver Canucks","Abbotsford Canucks","Kalamazoo Wings"],["Minnesota Wild","Iowa Wild","Jacksonville Icemen"],
  ["Boston Bruins","Providence Bruins","Maine Mariners"],["Colorado Avalanche","Colorado Eagles","New Mexico Goatheads"],
  ["Florida Panthers","Charlotte Checkers","Savannah Ghost Pirates"],["Washington Capitals","Hershey Bears","South Carolina Stingrays"],
  ["Detroit Red Wings","Grand Rapids Griffins","Toledo Walleye"],["Toronto Maple Leafs","Toronto Marlies","Cincinnati Cyclones"],
  ["Calgary Flames","Calgary Wranglers","Rapid City Rush"],["Dallas Stars","Texas Stars","Idaho Steelheads"],
  ["New Jersey Devils","Utica Comets","Adirondack Thunder"],["Montreal Canadiens","Laval Rocket","Trois-Rivières Lions"],
  ["Tampa Bay Lightning","Syracuse Crunch","Orlando Solar Bears"],["Philadelphia Flyers","Lehigh Valley Phantoms","Reading Royals"],
  ["Pittsburgh Penguins","Wilkes-Barre/Scranton Penguins","Florida Everblades"],["Columbus Blue Jackets","Cleveland Monsters","Wheeling Nailers"],
  ["Los Angeles Kings","Ontario Reign","Greenville Swamp Rabbits"],["Chicago Blackhawks","Rockford IceHogs","Indy Fuel"],
  ["San Jose Sharks","San Jose Barracuda","Wichita Thunder"],["Anaheim Ducks","San Diego Gulls","Tulsa Oilers"],
  ["Nashville Predators","Milwaukee Admirals","Atlanta Gladiators"],["Winnipeg Jets","Manitoba Moose","Bloomington Bison"],
  ["Carolina Hurricanes","Chicago Wolves","Greensboro Gargoyles"],["St. Louis Blues","Springfield Thunderbirds","Worcester Railers"],
  ["Ottawa Senators","Belleville Senators","Allen Americans"],["New York Islanders","Hamilton Hammers","Trenton Ironhawks"],
  ["Vegas Golden Knights","Henderson Silver Knights","Tahoe Knight Monsters"],["Buffalo Sabres","Rochester Americans",null],
  ["New York Rangers","Hartford Wolf Pack",null],["Utah Mammoth","Tucson Roadrunners",null]
 ],
 EURO:{
  SHL:["Frölunda HC","Färjestad BK","Skellefteå AIK","Luleå HF","Rögle BK","Växjö Lakers"],
  Liiga:["Tappara","Ilves","HIFK","KalPa","Kärpät","Lukko"],
  DEL:["Eisbären Berlin","Adler Mannheim","Red Bull München","ERC Ingolstadt","Grizzlys Wolfsburg"],
  "National League":["ZSC Lions","HC Davos","SC Bern","EV Zug","Lausanne HC","Fribourg-Gottéron"],
  "Czech Extraliga":["HC Dynamo Pardubice","HC Sparta Praha","HC Oceláři Třinec","HC Kometa Brno"],
  ICEHL:["Red Bull Salzburg","KAC","Vienna Capitals","HC Bozen","Fehérvár AV19"],
  "Asia League":["Tohoku Free Blades","Red Eagles Hokkaido","HL Anyang","Yokohama Grits","Nikko IceBucks"]
 },
 JUNIOR:{
  "Canada CHL":["London Knights","Oshawa Generals","Seattle Thunderbirds","Medicine Hat Tigers","Drummondville Voltigeurs"],
  "US NCAA":["Boston University","University of Michigan","Minnesota Golden Gophers","Penn State","Denver Pioneers"],
  Sweden:["Frölunda HC J20","Djurgårdens IF J20","Skellefteå AIK J20"],
  Finland:["Tappara U20","HIFK U20","Jokerit U20"],
  Japan:["Tohoku Free Blades","Red Eagles Hokkaido","Yokohama Grits","Nikko IceBucks"]
 }
};

let S=null, view="home", currentMatch=null;

function el(id){return document.getElementById(id)}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[rnd(0,a.length-1)]}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function safeSave(){try{if(S)localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const x=localStorage.getItem(KEY);return x?JSON.parse(x):null}catch(e){return null}}
function log(t){if(!S)return;S.feed.unshift("W"+S.week+"・"+t);S.feed=S.feed.slice(0,80)}
function leagueLabel(){return S.league==="NHL"?"NHL":S.league==="AHL"?"AHL":S.league==="ECHL"?"ECHL":S.league}
function org(){return teams.NHL.find(x=>x.includes(S.team))||null}
function ability(){return Math.max(1,Math.round(S.ovr+(S.form-50)*.12+(S.energy-50)*.08))}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function newCareer(){
 const name=el("pname").value.trim()||"HAYATO";
 const pos=el("position").value;
 const path=el("path").value;
 const list=teams.JUNIOR[path];
 const team=pick(list);
 S={
  name,pos,age:16,origin:path,phase:"Junior",league:path==="Canada CHL"?"CHL":path==="US NCAA"?"NCAA":path,
  team,ovr:rnd(44,50),potential:rnd(72,88),form:65,energy:90,morale:75,reputation:0,money:0,
  season:1,week:1,gp:0,g:0,a:0,plus:0,pim:0,injury:0,
  contract:"Junior / Amateur",years:0,drafted:false,draftTeam:"",draftRound:0,
  nhlOrg:false,twoWay:false,waiverEligible:false,nat:false,retired:false,
  inbox:[],feed:[],history:[],awards:[],cups:0,playoff:null,match:null,offers:[],
  startedAt:new Date().toISOString()
 };
 log("キャリア開始。1週間ごとに一つの行動を選ぶ。");
 safeSave();view="home";render();
}

function startScreen(){
 el("app").innerHTML=`<div class="wrap start">
 <div class="panel hero">
  <div class="title">🏒 ICE HOCKEY STORY</div>
  <p class="muted">ONE CHOICE AT A TIME</p>
  <p class="small">ジュニアからプロ、NHL、代表、そして引退まで。毎週の選択がキャリアを変える。</p>
 </div>
 <div class="panel">
  <div class="field"><label>選手名</label><input id="pname" placeholder="HAYATO"></div>
  <div class="field"><label>ポジション</label><select id="position"><option value="C">C</option><option value="LW">LW</option><option value="RW">RW</option><option value="DF">DF</option><option value="G">G</option></select></div>
  <div class="field"><label>スタート地点</label><select id="path">
   <option>Canada CHL</option><option>US NCAA</option><option>Sweden</option><option>Finland</option><option>Japan</option>
  </select></div>
  <button class="primary" data-action="new">キャリアを始める</button>
 </div>
 <p class="tiny muted">※外部ライブラリ・画像・Service Workerを使わない単一HTML版。</p>
 </div>`;
}

function top(){
 return `<div class="top"><div class="logo">🏒 ICE HOCKEY STORY<small>ONE CHOICE AT A TIME</small></div><button style="width:auto" data-action="save">💾</button></div>`;
}
function nav(){
 return `<div class="bottom"><div class="nav">
 <button class="${view==="home"?"active":""}" data-view="home"><i>🏒</i>ホーム</button>
 <button class="${view==="career"?"active":""}" data-view="career"><i>👤</i>キャリア</button>
 <button class="${view==="inbox"?"active":""}" data-view="inbox"><i>📨</i>受信箱</button>
 <button class="${view==="season"?"active":""}" data-view="season"><i>📅</i>シーズン</button>
 <button class="${view==="guide"?"active":""}" data-view="guide"><i>🌎</i>ガイド</button>
 </div></div>`;
}
function hero(){
 return `<div class="panel hero"><div class="row"><div><h2 style="margin-bottom:3px">${esc(S.name)}</h2><div class="small muted">${S.age}歳・${esc(S.pos)}・${esc(S.team)}</div></div><span class="tag">${esc(leagueLabel())}</span></div>
 <div class="grid" style="margin-top:10px">
  <div class="stat"><span>OVR</span><b>${S.ovr}</b><div class="bar"><i style="width:${S.ovr}%"></i></div></div>
  <div class="stat"><span>FORM</span><b>${S.form}</b><div class="bar"><i style="width:${S.form}%"></i></div></div>
  <div class="stat"><span>ENERGY</span><b>${S.energy}</b><div class="bar"><i style="width:${S.energy}%"></i></div></div>
  <div class="stat"><span>REPUTATION</span><b>${S.reputation}</b><div class="bar"><i style="width:${Math.min(100,S.reputation)}%"></i></div></div>
 </div></div>`;
}

function home(){
 if(S.retired)return retired();
 let eventCard="";
 if(S.inbox.length)eventCard=`<div class="panel"><div class="muted tiny">NEXT EVENT</div><h2 style="margin:3px 0">${esc(S.inbox[0].title)}</h2><p class="small">${esc(S.inbox[0].body)}</p><div class="actions">${S.inbox[0].choices.map((c,i)=>`<button class="${i===0?"primary":""}" data-event="${i}">${esc(c)}</button>`).join("")}</div></div>`;
 else eventCard=nextAction();
 return `<div class="wrap">${top()}${hero()}${eventCard}
 <div class="panel"><div class="row"><h3 style="margin:0">CAREER FEED</h3><span class="tiny muted">Season ${S.season}・Week ${S.week}</span></div><div class="feed">${S.feed.slice(0,8).map(x=>`<div>${esc(x)}</div>`).join("")}</div></div>${nav()}</div>`;
}

function nextAction(){
 if(S.playoff)return `<div class="panel hero"><div class="muted tiny">PLAYOFF</div><h2>勝負の舞台</h2><p class="small">${S.league==="NHL"?"Stanley Cup":S.league==="AHL"?"Calder Cup":"リーグ優勝"}を目指す。</p><button class="primary" data-action="playoff">プレーオフを進める</button></div>`;
 return `<div class="panel"><div class="muted tiny">WEEK ${S.week} ・ NEXT CHOICE</div><h2 style="margin:4px 0">今週どうする？</h2><p class="small muted">行動は一つ。コンディションと評価を見ながら選択する。</p>
 <div class="choice"><button class="choice" data-action="match"><span class="num">1</span><span><b>試合に挑む</b><small>成績・評価・出場機会を狙う</small></span></button></div>
 <div class="choice"><button class="choice" data-action="skill"><span class="num">2</span><span><b>個人練習</b><small>能力を伸ばすが体力を消費</small></span></button></div>
 <div class="choice"><button class="choice" data-action="tactic"><span class="num">3</span><span><b>戦術練習</b><small>フォームとチーム評価を整える</small></span></button></div>
 <div class="choice"><button class="choice" data-action="rest"><span class="num">4</span><span><b>休養</b><small>エネルギーとフォームを回復</small></span></button></div>
 </div>`;
}

function doTraining(type){
 if(S.injury>0){log("負傷中のため練習を見送った。");advanceWeek();return}
 const gain=type==="skill"?rnd(1,3):rnd(0,2);
 S.ovr=clamp(S.ovr+gain,1,S.potential);
 S.energy=clamp(S.energy-(type==="skill"?16:11),0,100);
 S.form=clamp(S.form+(type==="skill"?2:5),0,100);
 S.morale=clamp(S.morale+2,0,100);
 log(type==="skill"?`個人練習。OVR +${gain}。`:`戦術練習。OVR +${gain}。`);
 advanceWeek();
}
function rest(){
 S.energy=clamp(S.energy+30,0,100);S.form=clamp(S.form+7,0,100);S.morale=clamp(S.morale+4,0,100);
 log("休養してコンディションを回復。");advanceWeek();
}

function beginMatch(){
 if(S.injury>0){log(`${S.injury}週の負傷離脱。試合を欠場。`);advanceWeek();return}
 currentMatch={home:0,away:rnd(0,3),step:0,goal:0,assist:0};
 renderMatch();
}
function renderMatch(){
 const goalie=S.pos==="G";
 const texts=goalie?["2-on-1。最後のパスが通りそうだ。","スロット正面から強烈なシュート。","残り30秒、1点差。相手が6人攻撃。"]:["敵陣でパックを保持。DFが寄せてくる。","スロットにスペース。味方がパスを要求。","残り30秒、最後の攻撃を作る。"];
 const choices=goalie?[["前へ出る","角度を消す。高リスク・高リターン"],["深く構える","安定してシュートコースを待つ"],["リバウンドを外へ","守備評価を優先"]]:[["シュート","ゴール期待値は高いがミスのリスクもある"],["パス","味方との連携でアシストを狙う"],["ボードプレー","安全に攻撃を継続する"]];
 el("app").innerHTML=`<div class="wrap">${top()}<div class="panel">
 <div class="muted tiny">GAME DAY ・ WEEK ${S.week}</div><div class="score">${S.team}　${currentMatch.home} - ${currentMatch.away}　OPP</div>
 <div class="moment"><b>勝負どころ ${currentMatch.step+1}/3</b><p class="small muted" style="margin:5px 0 0">${texts[currentMatch.step]}</p></div>
 ${choices.map((x,i)=>`<button class="choice" data-moment="${i}"><span class="num">${i+1}</span><span><b>${x[0]}</b><small>${x[1]}</small></span></button>`).join("")}
 </div></div>`;
}
function matchChoice(i){
 const x=ability()+rnd(-12,12);let goal=false,assist=false;
 if(S.pos==="G"){
  const save=i===1?x<52:x<45;
  if(save){S.plus++;S.form=clamp(S.form+3,0,100)}else currentMatch.away++;
 }else{
  if(i===0){goal=x>58&&Math.random()<.64}
  if(i===1){assist=x>52&&Math.random()<.68}
  if(i===2){S.plus++;S.form=clamp(S.form+2,0,100)}
  if(goal){currentMatch.home++;S.g++;S.reputation+=3}
  if(assist){S.a++;S.reputation+=1}
 }
 S.energy=clamp(S.energy-9,0,100);currentMatch.step++;
 if(currentMatch.step<3){renderMatch();return}
 S.gp++;
 const win=currentMatch.home>currentMatch.away,draw=currentMatch.home===currentMatch.away;
 S.form=clamp(S.form+(win?6:draw?1:-5),20,100);S.morale=clamp(S.morale+(win?5:-3),20,100);
 if(Math.random()<.04){S.injury=rnd(1,3);log(`試合中に負傷。${S.injury}週間離脱。`)}
 log(`試合 ${currentMatch.home}-${currentMatch.away}。${win?"勝利":draw?"引き分け":"敗戦"}${goal?"・ゴール！":""}${assist?"・アシスト！":""}`);
 currentMatch=null;advanceWeek();
}

function advanceWeek(){
 if(S.injury>0)S.injury--;
 S.week++;
 if(S.week>24){endSeason();return}
 maybeEvent();
 safeSave();render();
}
function maybeEvent(){
 if([5,10,15,20].includes(S.week)){
  const pool=S.phase==="Junior"?[
   ["スカウトから連絡","スカウトが最近の試合を評価している。",["アピールする","練習を優先"]],
   ["ポジション争い","同じポジションの選手が台頭している。",["競争に挑む","チームプレーを優先"]]
  ]:[
   ["ロッカーの噂","コーチが起用法を検討しているらしい。",["追加練習を申し出る","休養を優先"]],
   ["代理人から連絡","市場であなたへの問い合わせが増えている。",["移籍先を探す","現在地に集中"]],
   ["メディア取材","最近のプレーについてコメントを求められた。",["目標を語る","チームへの感謝を強調"]]
  ];
  const e=pick(pool);S.inbox.unshift({type:"event",title:e[0],body:e[1],choices:e[2]});log("キャリアイベントが発生。");
 }
 if(S.phase==="Pro"&&S.week===16)generateOffers();
}

function handleEvent(i){
 const e=S.inbox.shift();if(!e)return;
 if(e.title==="スカウトから連絡"){i===0?(S.reputation+=5,S.form+=4):(S.energy+=8)}
 else if(e.title==="ポジション争い"){i===0?(S.ovr=clamp(S.ovr+1,1,S.potential),S.form+=4):(S.morale+=4)}
 else if(e.title==="ロッカーの噂"){i===0?(S.ovr=clamp(S.ovr+1,1,S.potential),S.energy-=12):(S.form+=6)}
 else if(e.title==="代理人から連絡"){i===0?generateOffers():(S.reputation+=1)}
 else if(e.title==="メディア取材"){S.reputation+=i===0?4:2;S.morale+=2}
 log(`イベント「${e.title}」で選択。`);safeSave();render();
}

function generateOffers(){
 const offers=[];const o=org();
 if(S.league==="ECHL"&&o)offers.push({kind:"callup",title:"AHLコールアップ",team:o[1],league:"AHL",detail:"短期コールアップ。結果次第で残留。"});
 if(S.league==="AHL"&&o&&S.ovr>=62)offers.push({kind:"callup",title:"NHLコールアップ",team:o[0],league:"NHL",detail:"NHLの短期コールアップ候補。"});
 if(S.league==="NHL"&&o)offers.push({kind:"assign",title:"AHL再アサイン",team:o[1],league:"AHL",detail:"出場時間を確保するための再アサイン。"});
 const euro=Object.keys(teams.EURO);
 if(S.ovr>=55)for(const l of euro)if(l!==S.league&&Math.random()<.5)offers.push({kind:"euro",title:"欧州クラブからオファー",team:pick(teams.EURO[l]),league:l,detail:"2年契約。出場機会を重視した条件。"});
 if(["NHL","AHL","ECHL"].includes(S.league)&&Math.random()<.55)offers.push({kind:"trade",title:"トレードの噂",team:pick(teams.NHL)[0],league:S.league,detail:"期限前に他球団が獲得へ興味。"});
 S.inbox=S.inbox.filter(x=>x.type==="event").concat(offers.slice(0,4));safeSave();render();
}
function acceptOffer(i){
 const o=S.inbox[i];if(!o)return;
 if(o.kind==="callup"||o.kind==="assign"){S.team=o.team;S.league=o.league;S.phase="Pro";S.nhlOrg=true;S.twoWay=true;S.contract=o.league==="NHL"?"NHL Two-Way Contract":"NHL Organization Assignment";S.years=o.league==="NHL"?2:1}
 else if(o.kind==="euro"){S.team=o.team;S.league=o.league;S.phase="Pro";S.contract="European Pro Contract";S.years=2;S.nhlOrg=false}
 else if(o.kind==="trade"){const t=teams.NHL.find(x=>x[0]===o.team)||pick(teams.NHL);S.team=S.league==="NHL"?t[0]:t[1]||t[0]}
 S.morale=clamp(S.morale+7,0,100);S.inbox.splice(i,1);log(`${o.title}を受諾。${o.team}`);safeSave();render();
}
function declineOffer(i){const o=S.inbox[i];S.inbox.splice(i,1);log(`${o.title}を辞退。`);safeSave();render()}

function endSeason(){
 const pts=S.g+S.a;
 S.history.unshift({season:S.season,league:S.league,team:S.team,gp:S.g,g:S.g,a:S.a,plus:S.plus});
 if(S.gp>=8&&pts/S.gp>=.7){S.awards.unshift("Top Performer");S.reputation+=8;S.ovr=clamp(S.ovr+2,1,S.potential)}
 else if(S.gp>=8&&pts/S.gp>=.4)S.ovr=clamp(S.ovr+1,1,S.potential);

 if(["NHL","AHL"].includes(S.league)&&S.gp>=8){S.playoff={round:1};log(S.league==="NHL"?"Stanley Cupプレーオフ進出！":"Calder Cupプレーオフ進出！");}
 if(S.age>=18&&!S.drafted&&S.league==="CHL")draft();
 if(S.age>=20&&S.ovr>=62&&Math.random()<.45){S.nat=true;S.reputation+=5;log("代表候補に選出された。")}
 S.age++;S.season++;S.week=1;S.gp=0;S.g=0;S.a=0;S.plus=0;S.pim=0;S.energy=88;S.form=65;S.injury=0;S.match=null;
 if(S.years>0)S.years--;
 if(S.years===0&&S.nhlOrg&&S.league==="AHL"){S.inbox.unshift({type:"contract",title:"契約更新の時期",body:"契約が満了した。代理人と次の契約を決めよう。",choices:["NHL組織に残る","市場を探す"]})}
 log(`${S.age}歳。新シーズン開始。`);safeSave();render();
}

function draft(){
 S.drafted=true;S.draftRound=rnd(1,7);const t=pick(teams.NHL);S.draftTeam=t[0];S.reputation+=8;
 S.inbox.unshift({type:"draft",title:"NHL Entry Draft",body:`${S.draftRound}巡目で${S.draftTeam}から指名された。キャンプ参加の機会がある。`,choices:["キャンプへ","まず現チームで成長"]});
 log(`NHL Entry Draft ${S.draftRound}巡目。${S.draftTeam}が指名。`);
}
function handleSpecial(i){
 const e=S.inbox.shift();
 if(e.type==="draft"){
  if(i===0)camp();else log("まず現チームで経験を積むことにした。");
 }else if(e.type==="contract"){
  if(i===0){S.years=2;S.contract="Two-Way Contract";S.nhlOrg=true;log("2年の組織契約を締結。")}
  else{S.nhlOrg=false;S.league="SHL";S.team=pick(teams.EURO.SHL);S.years=2;S.contract="European Pro Contract";log("欧州へ移籍。")}
 }
 safeSave();render();
}
function camp(){
 const x=ability()+rnd(-7,9);const t=teams.NHL.find(a=>a[0]===S.draftTeam)||pick(teams.NHL);
 if(x>=73){S.phase="Pro";S.league="AHL";S.team=t[1];S.nhlOrg=true;S.twoWay=true;S.contract="NHL Entry-Level / Two-Way";S.years=3;S.reputation+=8;log("NHLキャンプ合格。AHLでプロキャリアを開始。")}
 else if(x>=60){S.phase="Pro";S.league="ECHL";S.team=t[2]||t[1];S.nhlOrg=true;S.contract="PTO";S.years=0;log("PTOでプロキャンプ参加。まず下部リーグから。")}
 else log("キャンプで契約を勝ち取れなかった。");
}
function playoff(){
 if(!S.playoff)return;
 const chance=clamp(.40+(ability()-55)*.012+S.form*.002,.25,.88);
 if(Math.random()<chance){
  S.playoff.round++;
  if(S.playoff.round>=4){S.cups++;S.awards.unshift(S.league==="NHL"?"Stanley Cup":"Calder Cup");log(`${S.league==="NHL"?"Stanley Cup":"Calder Cup"}制覇！`);S.playoff=null;S.reputation+=12}
  else log("プレーオフ勝利。次ラウンドへ。");
 }else{log("プレーオフ敗退。");S.playoff=null}
 safeSave();render();
}
function retire(){S.retired=true;log("現役引退。キャリア終了。");safeSave();render()}
function retired(){return `<div class="wrap">${top()}<div class="panel hero"><h1>CAREER COMPLETE</h1><p>${esc(S.name)}のキャリアが終了した。</p><div class="grid"><div class="stat"><span>年齢</span><b>${S.age}</b></div><div class="stat"><span>OVR</span><b>${S.ovr}</b></div><div class="stat"><span>優勝</span><b>${S.cups}</b></div><div class="stat"><span>代表</span><b>${S.nat?"YES":"NO"}</b></div></div></div><div class="panel"><h3>キャリア履歴</h3>${S.history.map(h=>`<div class="feed"><div>${h.season}年目・${esc(h.team)}・${h.gp}GP ${h.g}G ${h.a}A</div></div>`).join("")}</div><button class="bad" data-action="reset">新しいキャリアを始める</button></div>`}

function career(){
 return `<div class="wrap">${top()}${hero()}<div class="panel"><h3>契約・所属</h3><p class="small">${esc(S.contract)} / ${S.years||0}年</p><span class="tag">${esc(S.league)}</span><span class="tag">${S.nhlOrg?"NHL ORGANIZATION":"INDEPENDENT"}</span><span class="tag">${S.twoWay?"TWO-WAY":""}</span></div>
 <div class="panel"><h3>個人成績</h3><div class="grid3"><div class="stat"><span>GP</span><b>${S.gp}</b></div><div class="stat"><span>G</span><b>${S.g}</b></div><div class="stat"><span>A</span><b>${S.a}</b></div></div></div>
 <div class="panel"><h3>受賞・タイトル</h3><p class="small">${S.awards.length?S.awards.map(a=>`<span class="tag">${esc(a)}</span>`).join(""):"まだなし"}</p></div>
 <button class="bad" data-action="retire">現役を引退する</button>${nav()}</div>`;
}
function inbox(){
 return `<div class="wrap">${top()}<div class="panel"><h2>受信箱</h2><p class="small muted">スカウト、代理人、クラブから届くキャリアイベント。</p></div>${S.inbox.length?S.inbox.map((o,i)=>{
 if(o.type==="event"||o.type==="draft"||o.type==="contract")return `<div class="inbox"><b>${esc(o.title)}</b><p class="body">${esc(o.body)}</p><div class="actions">${o.choices.map((c,j)=>`<button class="${j===0?"primary":""}" data-inbox="${i}" data-special="${j}">${esc(c)}</button>`).join("")}</div></div>`;
 return `<div class="inbox"><b>${esc(o.title)}</b><p class="body">${esc(o.team)} ・ ${esc(o.league)}<br>${esc(o.detail)}</p><div class="actions"><button class="good" data-offer="${i}">受諾</button><button class="ghost" data-decline="${i}">辞退</button></div></div>`;
 }).join(""):`<div class="panel muted small">現在、新しい通知はありません。</div>`}${nav()}</div>`;
}
function season(){
 return `<div class="wrap">${top()}<div class="panel"><div class="row"><h2 style="margin:0">Season ${S.season}</h2><span class="tag">Week ${S.week}/24</span></div><p class="small muted">現在：${esc(S.team)} / ${esc(S.league)}</p>${S.playoff?`<button class="primary" data-action="playoff">プレーオフを進める</button>`:""} </div>
 <div class="panel"><h3>過去シーズン</h3>${S.history.length?S.history.map(h=>`<div class="feed"><div><b>${h.season}年目</b> ${esc(h.team)}<br>${h.gp}GP ・ ${h.g}G ・ ${h.a}A ・ +/- ${h.plus}</div></div>`).join(""):`<p class="small muted">まだシーズン終了履歴はありません。</p>`}</div>${nav()}</div>`;
}
function guide(){
 return `<div class="wrap">${top()}<div class="panel"><h2>ホッケーキャリアの流れ</h2><p class="small">ジュニア → ドラフト → キャンプ → NHL組織 / 欧州移籍 → コールアップ → プレーオフ → 代表 → 引退。</p></div>
 <div class="panel"><h3>北米の基本構造</h3><p class="small">このゲームではNHLを頂点に、AHL・ECHLを育成経路として扱う。昇格・降格ではなく、契約・コールアップ・再アサイン・トレードで所属が動く。</p></div>
 <div class="panel"><h3>ゲームのコツ</h3><p class="small">能力だけでなくフォーム、体力、評判が重要。試合の3つの勝負どころで選択し、シーズン後の評価やオファーにつなげよう。</p></div>${nav()}</div>`;
}

function render(){
 try{
  if(!S){startScreen();return}
  if(view==="home")el("app").innerHTML=home();
  else if(view==="career")el("app").innerHTML=career();
  else if(view==="inbox")el("app").innerHTML=inbox();
  else if(view==="season")el("app").innerHTML=season();
  else el("app").innerHTML=guide();
 }catch(err){showError(err)}
}
function showError(err){
 el("app").innerHTML=`<div class="wrap"><div class="panel"><h2>読み込みエラー</h2><p class="small">ゲームの表示中にエラーが発生しました。</p><div class="error">${esc(err&&err.stack?err.stack:String(err))}</div><button style="margin-top:10px" data-action="reset">セーブをリセット</button></div></div>`;
}

document.addEventListener("click",function(e){
 const t=e.target.closest("[data-action],[data-view],[data-moment],[data-event],[data-inbox],[data-offer],[data-decline]");
 if(!t)return;
 if(t.dataset.view){view=t.dataset.view;render();return}
 const a=t.dataset.action;
 if(a==="new"){newCareer();return}
 if(a==="save"){safeSave();log("セーブしました。");render();return}
 if(a==="match"){beginMatch();return}
 if(a==="skill"){doTraining("skill");return}
 if(a==="tactic"){doTraining("tactic");return}
 if(a==="rest"){rest();return}
 if(a==="playoff"){playoff();return}
 if(a==="retire"){retire();return}
 if(a==="reset"){localStorage.removeItem(KEY);S=null;view="home";startScreen();return}
 if(t.dataset.moment!==undefined){matchChoice(Number(t.dataset.moment));return}
 if(t.dataset.event!==undefined){handleEvent(Number(t.dataset.event));return}
 if(t.dataset.inbox!==undefined){handleSpecial(Number(t.dataset.special));return}
 if(t.dataset.offer!==undefined){acceptOffer(Number(t.dataset.offer));return}
 if(t.dataset.decline!==undefined){declineOffer(Number(t.dataset.decline));return}
});

window.addEventListener("error",function(e){if(S)showError(e.error||e.message)});
window.addEventListener("unhandledrejection",function(e){if(S)showError(e.reason||"Promise error")});

try{S=load()}catch(e){S=null}
render();
</script>
</body>
</html>
